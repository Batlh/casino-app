name: gluckspfennig
description: Privates Offline-Casino zum Zeitvertreib. Spielmünzen ohne jeden Geldwert.
publish_to: none
version: 0.9.52+47

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  # Spielstand als Datei sichern und laden (Android über das System-Dateifenster, PC über den Dateidialog)
  file_picker: ^13.4.0
  # 0.15 ersetzt die reine Dart-Engine durch native Bindungen, darum bei 0.14 bleiben
  forge2d: ">=0.14.2 <0.15.0"
  # Speicherort am PC, um beim Umzug auf den neuen Paketnamen die alten Daten zu finden
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  # Link zum Quellcode auf GitHub im Browser öffnen
  url_launcher: ^6.3.0
  # Bildschirm anlassen (Einstellung)
  # Ab 1.7 mit eingebautem Kotlin (ohne Kotlin-Gradle-Plugin), braucht package_info_plus 10
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    # Lizenztexte der Schriften, erscheinen unter Einstellungen → Lizenzen
    - assets/fonts/Barlow-OFL.txt
    - assets/fonts/Shrikhand-OFL.txt
    - assets/fonts/NotoSerifJP-OFL.txt
  fonts:
    - family: Shrikhand
      fonts:
        - asset: assets/fonts/Shrikhand-Regular.ttf
    - family: Barlow
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700
    - family: Kanji
      fonts:
        - asset: assets/fonts/NotoSerifJP-Subset.ttf

flutter_launcher_icons:
  android: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#F2A33A"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  windows:
    generate: true
    image_path: assets/icon/icon.png
  macos:
    generate: true
    image_path: assets/icon/icon.png
