name: Prüfen
# Schnelle Prüfung ohne Bauen: nur Analyse und ausgewählte Tests. Spart Kontingent.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Testdateien, durch Leerzeichen getrennt (leer = alle)"
        type: string
        default: ""

jobs:
  check:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test
      - if: always()
        run: flutter test --reporter expanded ${{ inputs.tests }}
      # Mit "--update-goldens test_golden/..." in tests entstehen Bilder zur Sichtprüfung.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bilder
          path: test_golden/goldens/
          if-no-files-found: ignore
          retention-days: 1
      # Dieselben Bilder auf den Zweig „sichtpruefung“, damit sie sich per git holen lassen.
      - name: Bilder auf Zweig sichtpruefung
        if: always()
        continue-on-error: true
        run: |
          [ -d test_golden/goldens ] || exit 0
          cp -r test_golden/goldens /tmp/goldens
          cd /tmp/goldens
          git init -q -b sichtpruefung
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Bilder von ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sichtpruefung
