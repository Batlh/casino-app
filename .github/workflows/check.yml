name: Prüfen
# Schnelle Prüfung ohne Bauen: nur Analyse und ausgewählte Tests. Spart Kontingent.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Testdateien, durch Leerzeichen getrennt (leer = alle)"
        type: string
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test
      - if: always()
        run: flutter test --reporter expanded ${{ inputs.tests }}
      # Mit "--update-goldens test_golden/..." in tests entstehen Bilder zur Sichtprüfung.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilder
          path: test_golden/goldens/
          if-no-files-found: ignore
          retention-days: 1
