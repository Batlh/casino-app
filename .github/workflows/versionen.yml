name: Versionen als Releases sichern

# Einmalig von Hand starten: holt für jede Version den letzten Build aus den
# Artefakten und legt ihn als eigenes Release ab. Release-Dateien zählen nicht
# zum Actions-Speicher. Bereits vorhandene Releases werden übersprungen.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  sichern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Releases anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev=""
          while read -r v sha apk lin win datum; do
            [ -z "$v" ] && continue
            tag="v$v"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag gibt es schon"; prev="$sha"; continue
            fi
            rm -rf d up && mkdir -p d up
            gh run download "$apk" -n android-apk -D d/apk
            cp "$(find d/apk -name '*.apk' | head -1)" "up/gluckspfennig-$v.apk"
            if [ "$lin" != "-" ] && gh run download "$lin" -n linux -D d/lin; then
              f=$(find d/lin -name '*.tar.gz' | head -1); [ -n "$f" ] && cp "$f" "up/gluckspfennig-$v-linux.tar.gz"
            fi
            if [ "$win" != "-" ] && gh run download "$win" -n windows -D d/win; then
              f=$(find d/win -name '*.zip' | head -1); [ -n "$f" ] && cp "$f" "up/gluckspfennig-$v-windows.zip"
            fi
            {
              echo "Stand vom $datum (Commit ${sha:0:7})."
              echo
              echo "Änderungen seit der Vorversion:"
              if [ -n "$prev" ]; then range="$prev..$sha"; else range="$sha"; fi
              git log --no-merges --format='- %s' $range | sed 's/ *\[skip ci\]//' | head -40
            } > notes.md
            gh release create "$tag" --target "$sha" --title "Glückspfennig $v" \
              --notes-file notes.md --latest=false up/*
            echo "$tag angelegt: $(ls up | tr '\n' ' ')"
            prev="$sha"
          done <<'LISTE'
