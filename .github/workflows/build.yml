name: Build
on:
  push:
    branches: [main]
    # Kein Tag-Auslöser: Versions-Releases legt der Build selbst an. Ein Tag auf einem alten
    # Commit würde sonst den alten Build mit altem Workflow starten.
  workflow_dispatch:
    inputs:
      desktop:
        description: "Auch Windows und Linux bauen"
        type: boolean
        default: true
      macos:
        description: "Auch macOS bauen (öffentliches Repository, kostet nichts)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: bash ci/prepare.sh
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --reporter expanded
      - name: Bilder für die Sichtprüfung
        if: always()
        continue-on-error: true
        run: flutter test --update-goldens test_golden
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bilder
          path: test_golden/goldens/
          if-no-files-found: ignore
          retention-days: 1
      - name: Bilder unter Releases bereitstellen
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --title "Aktueller Stand" --notes "Wird bei jedem Build ersetzt."
          if [ -d test_golden/goldens ]; then
            (cd test_golden/goldens && zip -q -r "$GITHUB_WORKSPACE/bilder.zip" .)
            gh release upload latest bilder.zip --clobber
          fi
      - uses: actions/cache@v5
        with:
          path: ~/gradle-dist
          key: gradle-dist-${{ hashFiles('pubspec.lock') }}
          restore-keys: gradle-dist-
      - name: Gradle vorab laden
        run: |
          # Gradle selbst laden, mit Wiederholung und Fortsetzen. Der Download im Build bricht sonst manchmal ab.
          WRAP=android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/-all\.zip/-bin.zip/' "$WRAP"
          URL=$(grep '^distributionUrl=' "$WRAP" | cut -d= -f2- | sed 's/\\:/:/g')
          mkdir -p ~/gradle-dist
          FILE=~/gradle-dist/$(basename "$URL")
          NAME=$(basename "$URL")
          if [ ! -s "$FILE" ]; then
            # Bei Störungen von GitHub-Downloads auf Spiegel ausweichen
            for SRC in "$URL" "https://downloads.gradle.org/distributions/$NAME" \
                "https://mirrors.cloud.tencent.com/gradle/$NAME" "https://mirrors.aliyun.com/gradle/distributions/$NAME"; do
              echo "Lade $SRC"
              if curl -fL --retry 3 --retry-delay 10 --retry-all-errors -o "$FILE.part" "$SRC" && unzip -tq "$FILE.part"; then
                mv "$FILE.part" "$FILE"
                break
              fi
              rm -f "$FILE.part"
            done
          fi
          [ -s "$FILE" ] || exit 1
          if [ "$NAME" = gradle-9.3.1-bin.zip ]; then
            echo "b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06  $FILE" | sha256sum -c -
          fi
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\://$FILE#" "$WRAP"
          cat "$WRAP"
          mkdir -p ~/.gradle/init.d
          cp ci/maven-mirror.gradle ci/compile-sdk.gradle ~/.gradle/init.d/
      - name: Signierschlüssel entschlüsseln
        env:
          PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Ohne Secret nicht mit dem öffentlichen Debug-Schlüssel weiterbauen
          if [ -z "$PW" ]; then echo "::error::Secret ANDROID_KEY_PASSWORD fehlt"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in ci/release.keystore.enc \
            -out "$RUNNER_TEMP/release.keystore" -pass env:PW
      - name: APK bauen
        env:
          GP_KEYSTORE: ${{ runner.temp }}/release.keystore
          GP_KEYSTORE_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GP_KEY_ALIAS: gluckspfennig
        run: |
          # Der Gradle-Download bricht manchmal mit 504 ab, dann neu versuchen
          for try in 1 2 3; do
            flutter build apk --release && break
            [ "$try" = 3 ] && exit 1
            echo "Neuer Versuch in 30 Sekunden"; sleep 30
          done
          mv build/app/outputs/flutter-apk/app-release.apk gluckspfennig.apk
      - name: Signatur prüfen
        run: |
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs gluckspfennig.apk | tee signatur.txt
          # Fingerabdruck des eigenen Schlüssels (seit 0.9.3; davor der öffentliche Debug-Schlüssel)
          grep -qi "51c72022026bb67a144045b265980cf487e66ffc135e1dd486066dfd8e81bfff" signatur.txt
      - uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: gluckspfennig.apk
          if-no-files-found: error
          retention-days: 1
      - name: Unter Releases bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # „Aktueller Stand“ jedes Mal neu am aktuellen Commit anlegen: steht dann oben
          # in der Liste, und der Quellcode-Download passt zum Build.
          v=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          gh release delete latest --cleanup-tag -y >/dev/null 2>&1 || true
          files="gluckspfennig.apk"
          [ -f bilder.zip ] && files="$files bilder.zip"
          gh release create latest --prerelease --target "$GITHUB_SHA" --title "Aktueller Stand" \
            --notes "Wird bei jedem Build ersetzt. Version $v, Commit ${GITHUB_SHA:0:7}." $files
      - name: Neue Version als eigenes Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Jede Version bekommt beim ersten Build ein eigenes Release vX.Y.Z mit den Änderungen seit der Vorversion
          v=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v gibt es schon"; exit 0
          fi
          cp gluckspfennig.apk "gluckspfennig-$v.apk"
          prev=$(git log --format=%H -G'^version:' -- pubspec.yaml | sed -n 2p)
          {
            echo "Stand vom $(date +%F) (Commit ${GITHUB_SHA:0:7})."
            echo
            echo "Änderungen seit der Vorversion:"
            # Handgeschriebene Liste in docs/neu/<Version>.md, wichtigstes zuerst. Die App zeigt die ersten acht Zeilen mit „- “.
            if [ -f "docs/neu/$v.md" ]; then
              cat "docs/neu/$v.md"
            else
              # Sonst die Commit-Titel ohne interne Einträge (Version, Planung, Tests)
              git log --no-merges --format='- %s' ${prev:+$prev..}HEAD | sed 's/ *\[skip ci\]//' \
                | grep -v -E '^- (Version|Versionsnummer|Planung|Tests?|Golden|CI|Build)\b' | head -40
            fi
          } > notes.md
          gh release create "v$v" --target "$GITHUB_SHA" --title "Glückspfennig $v" --notes-file notes.md \
            --latest "gluckspfennig-$v.apk"

  # Linux läuft bei jedem Push mit, weil sich dieser Build direkt bedienen und prüfen lässt
  linux:
    needs: android
    # Auch wenn nur die APK scheitert, etwa an einem Downloadfehler
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: bash ci/prepare.sh
      - run: flutter build linux --release
      - run: |
          mkdir out
          tar -czf out/gluckspfennig-linux.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: out/*
          if-no-files-found: error
          retention-days: 1
      - name: Unter Releases bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest out/* --clobber
      - name: Ins Release der Version
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          name="gluckspfennig-$v-linux.tar.gz"
          if ! gh release view "v$v" --json assets --jq '.assets[].name' | grep -qx "$name"; then
            cp out/gluckspfennig-linux.tar.gz "$name" && gh release upload "v$v" "$name"
          fi

  desktop:
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.desktop)) }}
    needs: android
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.macos && '["windows","macos"]' || '["windows"]') }}
    runs-on: ${{ matrix.target == 'macos' && 'macos-latest' || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash ci/prepare.sh
        shell: bash
      - run: flutter build ${{ matrix.target }} --release
      - name: Packen
        shell: bash
        run: |
          mkdir out
          case "${{ matrix.target }}" in
            windows) 7z a out/gluckspfennig-windows.zip ./build/windows/x64/runner/Release/* ;;
            macos)   ditto -c -k --keepParent build/macos/Build/Products/Release/*.app out/gluckspfennig-macos.zip ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 1
      - name: Unter Releases bereitstellen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest out/* --clobber
      - name: Ins Release der Version
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          t=${{ matrix.target }}
          name="gluckspfennig-$v-$t.zip"
          if ! gh release view "v$v" --json assets --jq '.assets[].name' | grep -qx "$name"; then
            cp "out/gluckspfennig-$t.zip" "$name" && gh release upload "v$v" "$name"
          fi
