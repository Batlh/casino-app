            0.8.1 4b783e471a87c1b578ed417a79d3672c81d767df 2026-11-09
            0.8.2 872daf7a26eb12c5c392249276b724065949fcc2 2026-11-10
            0.8.3 b3695d9746acafd7faae87cf41a6e9b3b2d036a1 2026-11-11
            0.8.4 701c92a7370fc8b80edf06b1f7bd6d7b6f6a050d 2026-11-11
            0.8.5 ae6a03638bc11ca907fd15b53d06faa345995489 2026-11-11
            0.8.6 01da2fc2ab685f759b8d426afd0958c05cac3786 2026-11-12
            0.9.0 8587223137bb587879d6b9f828d0886ab8c667c9 2026-11-12
            0.9.1 d279aa88f3d3ead7bee437287f9da0c5d95eb02d 2026-11-12
            0.9.2 87d0f7db004eac93d530b3d0f9d16c3e850d895e 2026-11-12
            0.9.3 3f57867a058d2b9c29aea90a615e41223285638c 2026-11-14
          LISTE
          if [ -n "$fehler" ]; then
            echo "::warning::Nicht angelegt:$fehler"
          else
            gh release edit v0.9.3 --latest
            gh release delete versionen --cleanup-tag -y
            echo "Alle Versionen einzeln angelegt, Sammel-Release gelöscht"
          fi
