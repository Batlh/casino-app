name: Versionen als einzelne Releases

# Einmalig von Hand starten: macht aus dem Sammel-Release „versionen“ je Version ein
# eigenes Release vX.Y.Z am Commit der Version. Schon vorhandene werden übersprungen.
# Klappt alles, wird das Sammel-Release gelöscht.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  einzeln:
    runs-on: ubuntu-latest
    steps:
      - name: Releases anlegen
        env:
          # Tags auf alten Commits darf nur ein Token mit Workflow-Recht anlegen (RELEASE_TOKEN, danach löschen)
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          gh release view versionen --json body --jq .body > alle.md
          fehler=""
          while read -r v sha datum; do
            [ -z "$v" ] && continue
            tag="v$v"
            if gh release view "$tag" >/dev/null 2>&1; then echo "$tag gibt es schon"; continue; fi
            awk -v h="### $v (" 'index($0,h)==1{f=1;next} /^### /{f=0} f' alle.md | sed '/^$/d' > teil.md
            {
              echo "Stand vom $datum (Commit ${sha:0:7})."
              echo
              echo "Änderungen seit der Vorversion:"
              if [ -s teil.md ]; then cat teil.md; else echo "- Sicherheit: eigener Signierschlüssel; App einmal neu installieren (vorher Spielstand sichern)"; fi
            } > notes.md
            rm -rf up && mkdir up
            for f in "gluckspfennig-$v.apk" "gluckspfennig-$v-linux.tar.gz" "gluckspfennig-$v-windows.zip"; do
              gh release download versionen -D up -p "$f" 2>/dev/null || true
            done
            ls up
            if gh release create "$tag" --target "$sha" --title "Glückspfennig $v" --notes-file notes.md --latest=false up/*; then
              echo "$tag angelegt"
            else
              fehler="$fehler $tag"
            fi
          done <<'LISTE'
            0.1.0 9acc02f3a325204bf4cd94724e07bba5f7ceea4e 2026-11-03
            0.1.1 329e75dec18dc2c504f8aaab171653d01ad9ef54 2026-11-03
            0.1.2 4c12f4b943782ff8d2e3d716ccaf2bf4ff30a3c3 2026-11-04
            0.1.3 2a2c88800f2d8a830a7e0694af10cc4a6fee9626 2026-11-04
